<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoteNest - Personal Notebook</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
</head>
<body class="light-mode">
    <div id="app-container">
        <!-- Sidebar -->
        <aside id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <img src="assets/logo.svg" alt="NoteNest Logo" class="logo">
                <h2>NoteNest</h2>
                <button id="mobile-close-btn" class="icon-btn">&times;</button>
            </div>
            
            <nav class="sidebar-nav">
                <div class="nav-section">
                    <h3>Views</h3>
                    <ul id="view-filters">
                        <li data-view="dashboard" class="active">Dashboard</li>
                        <li data-view="all">All Notes</li>
                        <li data-view="pinned">Pinned</li>
                        <li data-view="archived">Archived</li>
                    </ul>
                </div>

                <div class="nav-section">
                    <h3>Categories</h3>
                    <ul id="category-filters">
                        <!-- Categories will be injected here -->
                    </ul>
                </div>
            </nav>
        </aside>

        <!-- Main Content -->
        <main id="main-content" class="main-content">
            <!-- Header -->
            <header class="main-header">
                <button id="mobile-menu-btn" class="icon-btn">☰</button>
                <div class="search-bar">
                    <input type="text" id="search-input" placeholder="Search notes...">
                    <button id="clear-search-btn" class="hidden">&times;</button>
                </div>
                <div class="header-actions">
                    <button id="theme-toggle-btn" class="icon-btn">🌙</button>
                    <button id="new-note-btn" class="primary-btn">+ New Note</button>
                    <button id="logout-btn" class="icon-btn" style="color: var(--danger-color); font-weight: bold; border: 1px solid var(--danger-color); border-radius: 8px; padding: 0 10px; font-size: 12px;">Logout</button>
                </div>
            </header>

            <div id="notification-area"></div>

            <!-- Dynamic Views Container -->
            <div id="view-container">
                <!-- Dashboard View -->
                <div id="dashboard-view" class="view active-view">
                    <h1>Dashboard</h1>
                    <div class="stats-grid" id="stats-container">
                        <!-- Stats cards injected here -->
                    </div>
                    <div class="recent-notes-section">
                        <h2>Recent Notes</h2>
                        <div class="notes-grid" id="recent-notes-grid">
                            <!-- Recent notes injected here -->
                        </div>
                    </div>
                </div>

                <!-- Notes View (All, Pinned, Archived, Category) -->
                <div id="notes-view" class="view hidden">
                    <div class="view-header">
                        <h1 id="current-view-title">All Notes</h1>
                        <div class="sort-control">
                            <label for="sort-select">Sort by:</label>
                            <select id="sort-select">
                                <option value="newest">Newest</option>
                                <option value="oldest">Oldest</option>
                                <option value="updated">Recently Updated</option>
                                <option value="az">A-Z</option>
                            </select>
                        </div>
                    </div>
                    <div id="search-results-info" class="hidden search-info-banner"></div>
                    <div class="notes-grid" id="notes-grid">
                        <!-- Notes injected here -->
                    </div>
                    <div id="empty-state" class="hidden empty-state">
                        <p>No notes found.</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Note Modal -->
    <div id="note-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">New Note</h2>
                <button id="close-modal-btn" class="icon-btn">&times;</button>
            </div>
            <form id="note-form">
                <input type="hidden" id="note-id">
                <div class="form-group">
                    <label for="note-title">Title *</label>
                    <input type="text" id="note-title" required placeholder="Note title">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="note-category">Category *</label>
                        <select id="note-category" required>
                            <!-- Categories injected here -->
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="note-tags">Tags (comma-separated)</label>
                        <input type="text" id="note-tags" placeholder="javascript, web, exam">
                    </div>
                </div>
                <div class="form-group">
                    <label for="note-body">Content *</label>
                    <textarea id="note-body" required placeholder="Write your note here..." rows="8"></textarea>
                </div>
                <div class="modal-actions">
                    <button type="button" id="cancel-note-btn" class="secondary-btn">Cancel</button>
                    <button type="submit" class="primary-btn">Save Note</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Confirm Delete Modal -->
    <div id="delete-modal" class="modal hidden">
        <div class="modal-content confirm-modal">
            <h2>Delete Note?</h2>
            <p>Are you sure you want to delete this note?</p>
            <p class="warning-text">This action cannot be undone.</p>
            <div class="modal-actions">
                <button type="button" id="cancel-delete-btn" class="secondary-btn">Cancel</button>
                <button type="button" id="confirm-delete-btn" class="danger-btn">Delete</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
