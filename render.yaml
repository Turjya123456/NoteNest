services:
  - type: web
    name: notenest
    runtime: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
    disk:
      name: notenest-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
