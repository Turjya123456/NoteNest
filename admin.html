<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoteNest - Admin</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: var(--bg-color);
            padding: 20px;
        }
        .admin-container {
            max-width: 800px;
            margin: 0 auto;
            background-color: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
            padding: 30px;
        }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }
        .admin-header h1 {
            font-size: 24px;
            color: var(--text-primary);
        }
        .logout-btn {
            padding: 8px 16px;
            background-color: transparent;
            color: var(--danger-color);
            border: 1px solid var(--danger-color);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .logout-btn:hover {
            background-color: var(--danger-color);
            color: white;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 30px;
        }
        th, td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-primary);
        }
        th {
            font-weight: 600;
            color: var(--text-secondary);
        }
        .action-btn {
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
        }
        .btn-delete {
            background-color: rgba(239, 68, 68, 0.1);
            color: var(--danger-color);
        }
        .btn-delete:hover {
            background-color: var(--danger-color);
            color: white;
        }
        .protected-label {
            color: var(--text-secondary);
            font-size: 12px;
            font-style: italic;
        }
        .add-user-form {
            display: flex;
            gap: 10px;
            align-items: flex-end;
            background-color: var(--bg-color);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }
        .form-group {
            flex: 1;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 12px;
            color: var(--text-secondary);
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 14px;
            background-color: var(--card-bg);
            color: var(--text-primary);
        }
        .add-btn {
            padding: 10px 20px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            height: 40px;
        }
        .add-btn:hover {
            background-color: var(--primary-hover);
        }
    </style>
</head>
<body class="light-mode">
    <div class="admin-container">
        <div class="admin-header">
            <div>
                <h1>NoteNest Admin</h1>
                <p style="color: var(--text-secondary); font-size: 14px; margin-top: 5px;">Welcome, admin</p>
            </div>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>

        <h3>Users</h3>
        <table id="users-table">
            <thead>
                <tr>
                    <th>Username</th>
                    <th>Role</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="users-tbody">
                <!-- User rows will be injected here -->
            </tbody>
        </table>

        <h3>Add User</h3>
        <form class="add-user-form" id="add-user-form">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="new-username" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="new-password" required>
            </div>
            <div class="form-group">
                <label>Role</label>
                <select id="new-role">
                    <option value="user">User</option>
                    <option value="admin">Admin</option>
                </select>
            </div>
            <button type="submit" class="add-btn">Add User</button>
        </form>
    </div>

    <script>
        async function fetchUsers() {
            try {
                const res = await fetch('/api/admin/users');
                if (res.status === 401 || res.status === 403) {
                    window.location.href = '/login';
                    return;
                }
                const users = await res.json();
                const tbody = document.getElementById('users-tbody');
                tbody.innerHTML = '';
                
                users.forEach(user => {
                    const tr = document.createElement('tr');
                    
                    const tdUsername = document.createElement('td');
                    tdUsername.textContent = user.username;
                    
                    const tdRole = document.createElement('td');
                    tdRole.textContent = user.role;
                    
                    const tdAction = document.createElement('td');
                    if (user.username === 'admin') {
                        const span = document.createElement('span');
                        span.className = 'protected-label';
                        span.textContent = 'Protected';
                        tdAction.appendChild(span);
                    } else {
                        const btn = document.createElement('button');
                        btn.className = 'action-btn btn-delete';
                        btn.textContent = 'Delete';
                        btn.onclick = () => deleteUser(user.id);
                        tdAction.appendChild(btn);
                    }

                    tr.appendChild(tdUsername);
                    tr.appendChild(tdRole);
                    tr.appendChild(tdAction);
                    tbody.appendChild(tr);
                });
            } catch (err) {
                console.error(err);
            }
        }

        async function deleteUser(id) {
            if (!confirm('Are you sure you want to delete this user?')) return;
            
            try {
                const res = await fetch(`/api/admin/users/${id}`, { method: 'DELETE' });
                if (res.ok) {
                    fetchUsers();
                } else {
                    alert('Failed to delete user');
                }
            } catch (err) {
                console.error(err);
            }
        }

        document.getElementById('add-user-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('new-username').value;
            const password = document.getElementById('new-password').value;
            const role = document.getElementById('new-role').value;

            try {
                const res = await fetch('/api/admin/users', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, role })
                });

                if (res.ok) {
                    document.getElementById('new-username').value = '';
                    document.getElementById('new-password').value = '';
                    fetchUsers();
                } else {
                    const data = await res.json();
                    alert(data.error || 'Failed to create user');
                }
            } catch (err) {
                console.error(err);
                alert('An error occurred');
            }
        });

        async function logout() {
            await fetch('/api/auth/logout', { method: 'POST' });
            window.location.href = '/login';
        }

        fetchUsers();
    </script>
</body>
</html>
